<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Azadipour</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }


        /* =========================================
           INTRO
        ========================================= */

        #intro {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;

            background: #000;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 99999;

            animation: introFadeOut 1.5s ease forwards;
            animation-delay: 14s;
        }


        /* =========================================
           LOGO AREA
        ========================================= */

        .logo-container {
            position: absolute;

            width: min(700px, 82vw);

            display: flex;
            justify-content: center;
            align-items: center;

            animation: logoMoveUp 1.5s ease forwards;
            animation-delay: 10.5s;
        }


        /* خود لوگوی AZADIPOUR */

        #main-logo {
            width: 100%;
            height: auto;

            opacity: 0;

            /*
             * ابتدا لوگو از سمت چپ به راست
             * به صورت تدریجی نمایان می‌شود
             */
            clip-path: inset(
                0 100% 0 0
            );

            animation:
                logoDraw 3.5s cubic-bezier(.77,0,.18,1) forwards,
                logoGlow 3s ease-in-out 4s infinite alternate;

            animation-delay: 0.5s, 4s;
        }


        /* =========================================
           LOGO DRAW EFFECT
        ========================================= */

        @keyframes logoDraw {

            0% {
                opacity: 0;
                clip-path: inset(0 100% 0 0);
                transform: scale(0.96);
                filter: brightness(0.3) blur(4px);
            }

            15% {
                opacity: 1;
            }

            60% {
                clip-path: inset(0 35% 0 0);
                filter: brightness(1.2) blur(0);
            }

            100% {
                opacity: 1;
                clip-path: inset(0 0 0 0);
                transform: scale(1);
                filter: brightness(1) blur(0);
            }
        }


        /* =========================================
           METALLIC LIGHT
        ========================================= */

        @keyframes logoGlow {

            0% {
                filter:
                    brightness(1)
                    drop-shadow(0 0 5px rgba(255,255,255,0.15));
            }

            100% {
                filter:
                    brightness(1.15)
                    drop-shadow(0 0 28px rgba(255,255,255,0.55));
            }
        }


        /* =========================================
           LOGO MOVES SLIGHTLY UP
        ========================================= */

        @keyframes logoMoveUp {

            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-110px);
            }
        }


        /* =========================================
           WELCOME
        ========================================= */

        #welcome {

            position: absolute;

            top: 58%;

            width: 100%;

            text-align: center;

            font-size: clamp(
                38px,
                7vw,
                90px
            );

            font-weight: 600;

            letter-spacing: 18px;

            color: #fff;

            opacity: 0;

            transform: translateY(35px);
            text-shadow:
                0 0 10px rgba(255,255,255,0.2),
                0 0 30px rgba(255,255,255,0.15);

            animation: welcomeReveal 2.5s ease forwards;

            animation-delay: 10.8s;
        }


        @keyframes welcomeReveal {

            0% {
                opacity: 0;
                transform: translateY(35px);
                letter-spacing: 30px;
            }

            50% {
                opacity: 0.8;
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                letter-spacing: 18px;
            }
        }


        /* =========================================
           INTRO FADE OUT
        ========================================= */

        @keyframes introFadeOut {

            0% {
                opacity: 1;
                visibility: visible;
            }

            100% {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }


        /* =========================================
           MAIN WEBSITE
        ========================================= */

        #website {

            min-height: 100vh;

            opacity: 0;

            transform: translateY(25px);

            animation:
                websiteReveal 2s ease forwards;

            animation-delay: 14.2s;
        }


        @keyframes websiteReveal {

            0% {
                opacity: 0;
                transform: translateY(25px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================
           HEADER
        ========================================= */

        header {

            position: sticky;
            top: 0;

            z-index: 1000;

            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 6%;

            background: rgba(0,0,0,0.88);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid rgba(255,255,255,0.12);
        }


        .header-logo {

            width: 95px;
            height: auto;
        }


        nav {

            display: flex;

            gap: 35px;
        }


        nav a {

            color: #fff;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: 1px;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        nav a:hover {

            opacity: 0.55;

            transform: translateY(-2px);
        }


        /* =========================================
           HERO
        ========================================= */

        .hero {

            min-height: 78vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 100px 20px;
        }


        .hero h1 {

            font-size:
                clamp(48px, 9vw, 115px);

            font-weight: 500;

            letter-spacing: 8px;

            margin-bottom: 30px;
        }


        .hero p {

            max-width: 780px;

            color: #b8b8b8;

            font-size: 19px;

            line-height: 1.9;
        }


        /* =========================================
           CARDS
        ========================================= */

        .sections {

            width: 90%;

            max-width: 1300px;

            margin: auto;

            padding-bottom: 110px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(300px, 1fr)
                );

            gap: 30px;
        }


        .card {

            min-height: 320px;

            padding: 45px 35px;

            border-radius: 20px;
            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #080808
                );

            border:
                1px solid
                rgba(255,255,255,0.12);

            transition:
                transform 0.4s ease,
                border-color 0.4s ease,
                box-shadow 0.4s ease;
        }


        .card:hover {

            transform: translateY(-10px);

            border-color:
                rgba(255,255,255,0.45);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.7);
        }


        .card h2 {

            font-size: 27px;

            font-weight: 500;

            letter-spacing: 2px;

            margin-bottom: 25px;
        }


        .card p {

            color: #bdbdbd;

            font-size: 16px;

            line-height: 1.9;
        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {

            border-top:
                1px solid
                rgba(255,255,255,0.1);

            text-align: center;

            padding: 35px 20px;

            color: #707070;

            font-size: 13px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .logo-container {

                width: 88vw;
            }

            #welcome {

                font-size: 34px;

                letter-spacing: 9px;
            }

            header {

                padding: 15px 20px;
            }

            .header-logo {

                width: 75px;
            }

            nav {

                gap: 14px;
            }

            nav a {

                font-size: 10px;
            }

            .hero {

                min-height: 70vh;
            }

            .hero h1 {

                letter-spacing: 4px;
            }

            .hero p {

                font-size: 16px;
            }

            .card {

                padding: 32px 25px;
            }
        }

    </style>
</head>
