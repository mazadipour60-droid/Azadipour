<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AZADIPOUR | Export · Import · Investitionen</title>

    <meta name="description" content="AZADIPOUR – Internationale Geschäftsbeziehungen, Export, Import und Investitionen.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.92);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 50%;
        }

        nav {
            display: flex;
            gap: 28px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #cfcfcf;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 20px 80px;
            background:
                radial-gradient(circle at center, #202020 0%, #090909 45%, #000000 100%);
        }

        .hero-content {
            max-width: 900px;
        }

        .hero-logo {
            width: 230px;
            max-width: 70%;
            margin-bottom: 35px;
        }

        .hero h1 {
            font-size: clamp(50px, 10vw, 110px);
            letter-spacing: 12px;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .hero h2 {
            font-size: clamp(22px, 4vw, 38px);
            font-weight: 300;
            letter-spacing: 5px;
            color: #d7d7d7;
            margin-bottom: 25px;
        }

        .hero p {
            color: #aaaaaa;
            font-size: 18px;
            max-width: 700px;
            margin: auto;
        }

        .button {
            display: inline-block;
            margin-top: 40px;
            padding: 15px 32px;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .button:hover {
            background: #ffffff;
            color: #000000;
        }

        section {
            padding: 110px 8%;
        }

        .section-title {
            text-align: center;
            font-size: 38px;
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .section-intro {
            max-width: 750px;
            margin: 0 auto 60px;
            text-align: center;
            color: #aaaaaa;
            font-size: 17px;
        }

        .cards {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .card {
            padding: 50px 40px;
            background: linear-gradient(145deg, #151515, #090909);
            border: 1px solid #292929;
            transition: 0.4s;
        }
